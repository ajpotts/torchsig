[build-system]
# Define build dependencies and backend
requires = ["setuptools>=61", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "torchsig"
description = "Signal Processing Machine Learning Toolkit"
authors = [
    {name = "TorchSig Team"},
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["signal processing", "machine learning"]
dynamic = ["version"]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

# === RUNTIME DEPENDENCIES (What the end-user needs) ===
dependencies = [
    # Core Libraries
    "torch",
    "torchaudio",
    "lightning",
    "tqdm",
    "numpy>=2",
    "scipy",
    "h5py",
    "matplotlib",
    "PyYAML",
    "opencv-python>=4.10",
    "numba>=0.60",
    "soundfile",
]

# === OPTIONAL DEVELOPMENT DEPENDENCIES (What developers need) ===
[project.optional-dependencies]
dev = [
    "torchsig[docs]",
    # Testing & Linting
    "pytest",
    "pylint",
    "pytest-cov",
    "pytest-benchmark",
    "pytest-xdist",
    "ruff",
    "pygal",
    "pre-commit",
]

docs = [
    "Sphinx>=8.2,<10",
    "sphinx-rtd-theme>=3.1,<4",
    "sphinxcontrib-jquery>=4,<5",
    "six==1.17.0",
    "numba==0.67.0",
    "better-apidoc>=0.3.2"
]

notebooks = [
    "jupyter",
    "nbconvert",
    "nbclient",
    "notebook",
    "ipykernel",
    "ipywidgets",
    "nb-clean",
    "tqdm",
    "sigmf",
]

examples = [
    "torchsig[notebooks]",
    "opencv-python>=4.10",
]

[project.urls]
Homepage = "https://torchsig.com/"
Documentation = "https://torchsig.readthedocs.io/en/latest/index.html"
Repository = "https://github.com/TorchDSP/torchsig.git"
Issues = "https://github.com/TorchDSP/torchsig/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
# Dynamically read version from torchsig.__version__
version = {attr = "torchsig.__version__"}

[tool.coverage.run]
branch = true
source = ["torchsig"]

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = []

[tool.pytest.ini_options]
markers = [
    "full: marks tests as full (run with --full option)",
    "slow: skipped in fast mode",
    "slow_no_gpu: skipped in fast mode only when no GPU is available",
]
# addopts = "-m 'not full' --cov=torchsig --cov-report=xml --cov-report=term-missing --junitxml=report.xml"
addopts = "-m 'not full'"
testpaths = ["tests", "benchmarks"]
python_files = ["benchmark_*.py", "test_*.py"]
python_functions = ["test_*", "benchmark_*"]

[tool.ruff]
line-length = 200
target-version = "py310"
exclude = ["docs", "*.ipynb"]

[tool.ruff.lint]
# Enable all rules by default
select = ["ALL"]
# Ignore specific rules
ignore = [
    "ANN", # flake8-annotations
    "COM", # flake8-commas
    "C90", # mccabe complexity
    "DJ",  # django
    "EXE", # flake8-executable
    "T10", # debugger
    "TID", # flake8-tidy-imports
    "B006", # Do not use mutable data structures for argument defaults
    "E501",  # Line too long (handled by line-length)
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__
    "D204", # 1 blank line required after class docstring
    "D205", # 1 blank line required between summary line and description
    "D400", # First line should end with a period
    "D401", # First line of docstring should be in imperative mood
    "D413", # Missing blank line after last section
    "D415", # First line should end with a period, question mark, or exclamation point
    "D417", # Missing argument description in the docstring for `__init__`: `**kwargs`
    "C901",  # Function too complex
    "PLR0913",  # Too many arguments
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "PLW2901",  # Redefined loop name
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link in TODO
    "TRY003", # external messages in exceptions are too verbose
    "FIX002",  # Line contains TODO
    "FBT001", # Boolean-typed positional argument in function definition
    "FBT002", # Boolean default positional argument in function definition
    "E722", # Do not use bare `except`
    "EM101",  # Exception must not use a string literal
    "EM102",  # Exception must not use an f-string literal
    "G004",  # Logging statement uses f-string
    "COM812",  # Trailing comma missing
    "ISC001",  # Implicitly concatenated string literals
    "D203",  # One blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
    "T201", # `print` found
    # Baseline existing violations that require manual or unsafe changes.
    "A004",
    "ARG001", "ARG002", "ARG005",
    "B007", "B017", "B904", "B905", "BLE001",
    "C403", "C408", "C414", "C416",
    "D101", "D102", "D103", "D105",
    "E402", "E711", "E721", "E731", "E741", "ERA001",
    "F401", "F811", "F821", "F822", "F841", "FBT003",
    "ICN001", "INP001",
    "N802", "N803", "N806", "N812", "N816", "NPY002",
    "PERF102", "PERF203", "PERF401", "PIE810",
    "PLC0206", "PLC0415", "PLR0124", "PLR0911", "PLR2004", "PLW0108",
    "PT006", "PT011", "PT012", "PT014",
    "PTH103", "PTH107", "PTH109", "PTH110", "PTH113", "PTH118", "PTH123", "PTH202", "PTH208",
    "PYI034", "RET503", "RET504",
    "RUF001", "RUF002", "RUF003", "RUF012", "RUF013", "RUF043", "RUF046", "RUF059",
    "S101", "S108", "S110", "S113", "S301", "S603",
    "SIM101", "SIM105", "SIM108", "SIM113", "SIM118", "SIM201",
    "SLF001", "TRY201", "TRY301", "W291",
]

[tool.ruff.format]
# Enable auto-formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules for test files
"tests/*" = [
    "S101",  # Use of assert
    "PLR2004",  # Magic value used in comparison
    "ARG001",  # Unused function argument
    "D103",  # Missing docstring in public function
]

"benchmarks/*" = [
    "S101",  # Use of assert
    "PLR2004",  # Magic value used in comparison
    "ARG001",  # Unused function argument
    "D102",  # Missing docstring in public function
]
